name: Release

# Attaches rohlik-courier-card.js to a published release (HACS downloads it from there)
# after checking that the card's VERSION matches the tag.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check version matches tag
        run: |
          version=$(sed -n 's/^const VERSION = "\(.*\)";/\1/p' rohlik-courier-card.js)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match card VERSION $version"
            exit 1
          fi
      - name: Attach card to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" rohlik-courier-card.js --clobber --repo "$GITHUB_REPOSITORY"
