<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>Náhled</title>
<style>
:root{--primary-color:#03a9f4;--card-background-color:#fff;--primary-text-color:#212121;--secondary-text-color:#727272;--divider-color:#e0e0e0;--warning-color:#ff9800}
.dark{--card-background-color:#1c1c1c;--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--divider-color:#2f2f2f;background:#111;padding:12px 16px 16px;margin:0 -16px}
body{margin:0;background:#f5f5f5;font-family:Roboto,Arial,sans-serif;padding:16px;width:1065px}
h1{font-size:18px;font-weight:500;margin:0 0 4px}p{margin:0 0 6px;color:#666;font-size:13px}
h2{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.4px;margin:18px 0 6px}
.fake{display:flex;gap:8px;margin-top:8px;opacity:.5}.fake div{background:#fff;border:1px solid #e0e0e0;border-radius:12px;height:64px;flex:1;display:flex;align-items:center;justify-content:center;font-size:24px}.fake div:first-child{flex:0 0 250px;font-size:44px}
</style>
<script>customElements.define('ha-icon',class extends HTMLElement{connectedCallback(){this.style.cssText+='display:inline-block;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);border-radius:5px;background:currentColor;opacity:.5'}});</script>
<script src="../rohlik-courier-card.js"></script>
</head><body>
<h1>Rohlík – jedna karta, mění obsah</h1>
<p>Bez objednávky je karta skrytá. Ikony jsou v náhledu jen šedé čtverečky, v HA budou MDI ikony. Otevři přes lokální server: <code>python3 -m http.server</code> v kořeni repozitáře → http://localhost:8000/dev/preview.html</p>
<div id="root"></div>
<script>
const now=Date.now(),m=60000,iso=t=>new Date(t).toISOString();
const day=new Date();day.setHours(0,0,0,0);
const at=(d,h,mi=0)=>day.getTime()+d*86400000+(h*60+mi)*m;
const E=(id,k)=>({entity_id:id,platform:'rohlikcz',translation_key:k});
const ents={};[['binary_sensor.k','courier_on_the_way'],['sensor.e','delivery_time'],['sensor.m','delivery_minutes'],['sensor.b','bags_amount'],['binary_sensor.o','is_ordered'],['sensor.i','delivery_info'],['sensor.s','next_order_since'],['sensor.t','next_order_till'],['sensor.d','order_edit_deadline']].forEach(([i,k])=>ents[i]=E(i,k));
function hass(o){const st={};
 st['binary_sensor.o']={state:'on',attributes:{order_data:{id:1,itemsCount:21,priceComposition:{total:{amount:1062.44}},deliverySlot:{since:iso(o.since),till:iso(o.till)}},items:ITEMS}};
 st['sensor.d']={state:o.deadline?iso(o.deadline):'unknown'};
 st['sensor.s']={state:iso(o.since)};st['sensor.t']={state:iso(o.till)};st['sensor.i']={state:o.msg||'unknown'};st['sensor.b']={state:'9'};
 if(o.mins!==undefined){const eta=now+o.mins*m;st['binary_sensor.k']={state:'on',attributes:{departed_at:iso(now-45*m),initial_eta:iso(eta-(o.shift||0)*m),courier:'Petr',phone:o.phone||null,nearby:!!o.phone}};st['sensor.e']={state:iso(eta)};st['sensor.m']={state:String(o.mins)};}
 else st['binary_sensor.k']={state:'off',attributes:{}};
 return {entities:ents,states:st};}
const ITEMS=[['Miil Máslo 82%',2,'250 g'],['BIO kiwi kus (cca 80g)',4,'1 ks'],['Vepřová plec',1,'0,941 kg'],['Rohlíkův Žitný rohlík',2,'70 g'],['Miil Gouda 47% plátky',6,'150 g'],['Čerstvě utrženo – Rajčata koktejlová cherry',1,'320 g'],['Uniferm droždí čerstvé',1,'42 g'],['Charlie\'s Organics BIO Mučenka plech',1,'330 ml']].map(([name,amount,textual_amount])=>({name,amount,textual_amount}));
const cases=[
 ['Objednáno večer předem',{since:at(1,9),till:at(1,10),deadline:at(1,2)+50*m,msg:'Kurýr přijede s nákupem přibližně v 10:00. Stále je možné přidávat do objednávky další zboží.'}],
 ['Objednáno – doobjednání už skončilo',{since:now+95*m,till:now+155*m,deadline:now-60*m,msg:'Tašky už se začínají plnit vaším nákupem. Aktuálně to vypadá, že k vám kurýr dorazí zhruba v 09:00. Na viděnou!'}],
  ['Kurýr jede',{since:at(0,9),till:at(0,10),mins:47}],
 ['Kurýr jede, odhad +12',{since:at(0,9),till:at(0,10),mins:35,shift:12}],
 ['Kurýr blízko',{since:at(0,9),till:at(0,10),mins:6,phone:'+420000000001'}],
 ['Přijíždí',{since:at(0,9),till:at(0,10),mins:1,phone:'+420000000001'}],
 ['Zpoždění',{since:at(0,9),till:at(0,10),mins:-4,phone:'+420000000001'}],
];
const root=document.getElementById('root');
function add(parent,label,c){const h=document.createElement('h2');h.textContent=label;parent.append(h);const el=document.createElement('rohlik-courier-card');el.setConfig({});el.hass=hass(c);parent.append(el);}
cases.forEach(([l,c],i)=>{add(root,l,c);if(i===0){const f=document.createElement('div');f.className='fake';f.innerHTML='<div>12:41</div><div>23,1 °C</div><div>52%</div><div>720 ppm</div><div>17 lx</div>';root.append(f);}});
const dk=document.createElement('div');dk.className='dark';root.append(dk);
add(dk,'Tmavé téma – objednáno',cases[0][1]);add(dk,'Tmavé téma – kurýr jede',cases[3][1]);
</script></body></html>
